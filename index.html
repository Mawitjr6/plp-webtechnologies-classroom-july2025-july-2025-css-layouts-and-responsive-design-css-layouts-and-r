<!DOCTYPE html>
<html>
<head>
    <title>Flexbox</title>
    <style>
        .container{
            display: flex;
          flex-wrap: wrap;
          flex-direction: row;
          gap: 10px;
        }
        .box{
            flex: 1 1 30%;
            background-color: darkblue;
            color: white;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">item 1</div>
        <div class="box">item 2</div>
        <div class="box">item 3</div>
        </div>
    </div>
</body>
</html>
